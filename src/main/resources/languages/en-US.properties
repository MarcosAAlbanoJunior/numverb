# =============================================================================
# English (United States) — en-US
# Number vocabulary and grammar configuration
# =============================================================================

# Units 0–19
unit.0=zero
unit.1=one
unit.2=two
unit.3=three
unit.4=four
unit.5=five
unit.6=six
unit.7=seven
unit.8=eight
unit.9=nine
unit.10=ten
unit.11=eleven
unit.12=twelve
unit.13=thirteen
unit.14=fourteen
unit.15=fifteen
unit.16=sixteen
unit.17=seventeen
unit.18=eighteen
unit.19=nineteen

# Tens (20, 30, ..., 90)
ten.20=twenty
ten.30=thirty
ten.40=forty
ten.50=fifty
ten.60=sixty
ten.70=seventy
ten.80=eighty
ten.90=ninety

# Hundreds — English always uses "one hundred", "two hundred", etc.
# The combined form (101–199) is identical to the standalone form.
hundred.100=one hundred
hundred.100.combined=one hundred
hundred.200=two hundred
hundred.300=three hundred
hundred.400=four hundred
hundred.500=five hundred
hundred.600=six hundred
hundred.700=seven hundred
hundred.800=eight hundred
hundred.900=nine hundred

# Scales
# English includes "one" before thousand: "one thousand", not just "thousand".
scale.mil=thousand
scale.mil.skip-one=false

scale.milhao.singular=million
scale.milhao.plural=million

scale.bilhao.singular=billion
scale.bilhao.plural=billion

scale.trilhao.singular=trillion
scale.trilhao.plural=trillion

scale.quatrilhao.singular=quadrillion
scale.quatrilhao.plural=quadrillion

scale.quintilhao.singular=quintillion
scale.quintilhao.plural=quintillion

scale.sextilhao.singular=sextillion
scale.sextilhao.plural=sextillion

scale.setilhao.singular=septillion
scale.setilhao.plural=septillion

# Grammar connector — used after hundreds and between small scale groups
connector=and

# Tens–units separator: hyphen, no surrounding spaces ("twenty-one")
tens.separator=-

# Gender used when counting scale words (grammatically neutral in English)
scale.gender=masculine

# No "of" preposition before currency in English ("one million dollars", not "one million of dollars")
# currency.preposition is intentionally absent
