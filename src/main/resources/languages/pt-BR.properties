# =============================================================================
# Portuguese (Brazil) — pt-BR
# Number vocabulary and grammar configuration
# =============================================================================

# Units 0–19 (irregular forms in Portuguese)
unit.0=zero
unit.1=um
unit.1.feminine=uma
unit.2=dois
unit.2.feminine=duas
unit.3=três
unit.4=quatro
unit.5=cinco
unit.6=seis
unit.7=sete
unit.8=oito
unit.9=nove
unit.10=dez
unit.11=onze
unit.12=doze
unit.13=treze
unit.14=quatorze
unit.15=quinze
unit.16=dezesseis
unit.17=dezessete
unit.18=dezoito
unit.19=dezenove

# Tens (20, 30, ..., 90)
ten.20=vinte
ten.30=trinta
ten.40=quarenta
ten.50=cinquenta
ten.60=sessenta
ten.70=setenta
ten.80=oitenta
ten.90=noventa

# Hundreds
# 100 alone = "cem"; 100 + something = "cento"
hundred.100=cem
hundred.100.combined=cento
hundred.200=duzentos
hundred.200.feminine=duzentas
hundred.300=trezentos
hundred.300.feminine=trezentas
hundred.400=quatrocentos
hundred.400.feminine=quatrocentas
hundred.500=quinhentos
hundred.500.feminine=quinhentas
hundred.600=seiscentos
hundred.600.feminine=seiscentas
hundred.700=setecentos
hundred.700.feminine=setecentas
hundred.800=oitocentos
hundred.800.feminine=oitocentas
hundred.900=novecentos
hundred.900.feminine=novecentas

# Scales
# "mil" is invariable (not "um mil" for 1000)
scale.mil=mil

scale.milhao.singular=milhão
scale.milhao.plural=milhões

scale.bilhao.singular=bilhão
scale.bilhao.plural=bilhões

scale.trilhao.singular=trilhão
scale.trilhao.plural=trilhões

scale.quatrilhao.singular=quatrilhão
scale.quatrilhao.plural=quatrilhões

scale.quintilhao.singular=quintilhão
scale.quintilhao.plural=quintilhões

scale.sextilhao.singular=sextilhão
scale.sextilhao.plural=sextilhões

scale.setilhao.singular=setilhão
scale.setilhao.plural=setilhões

# Grammar connector
connector=e
